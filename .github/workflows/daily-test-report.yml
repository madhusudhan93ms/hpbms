name: Daily 9 AM Test Suite & Email Report

on:
  schedule:
    # 03:30 UTC = 09:00 AM Indian Standard Time (IST) every day
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Destination email address for test report'
        required: false
        default: 'narayanamadhu93@gmail.com'

jobs:
  run-daily-tests:
    name: Execute Daily Test Suite & Send Report
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      REPORT_EMAIL: ${{ github.event.inputs.recipient_email || 'narayanamadhu93@gmail.com' }}
      VITE_API_URL: http://localhost:5001/api/v1
      MONGO_URI: mongodb://localhost:27017/svlh_hospital_test_db
      JWT_SECRET: svlh_ci_jwt_secret_test_key_2026
      REFRESH_TOKEN_SECRET: svlh_ci_refresh_secret_test_key_2026
      FIELD_ENCRYPTION_KEY: aHBtYnNfYWVzMjU2X2VuY3J5cHRpb25fa2V5XzMyYiE=
      SEARCH_HASH_KEY: svlh_search_hash_secret_key_2026_local_dev_safe_key_32b
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'Sri Vijaya Lakshmi Hospital <noreply@srivijayalakshmihospital.com>' }}
      CI: true

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Install Playwright Chromium Browser
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Complete Daily Test Suite & Generate Report
        id: run_suite
        run: |
          node scripts/run-daily-test-suite.js
        continue-on-error: true

      - name: Publish Test Summary to GitHub Workflow
        if: always()
        run: |
          if [ -f daily-test-report.html ]; then
            cat daily-test-report.html >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Daily Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-report
          path: |
            daily-test-report.html
            daily-test-report.json
          retention-days: 30

      - name: Send Email Report to Recipient
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Sri Vijaya Lakshmi Hospital — Daily 9:00 AM Test Report [${{ steps.run_suite.outcome == 'success' && 'ALL PASSED' || 'FAILURES DETECTED' }}]"
          to: ${{ env.REPORT_EMAIL }}
          from: ${{ env.EMAIL_FROM }}
          html_body: file://daily-test-report.html
          convert_markdown: false
        continue-on-error: true

      - name: Enforce Exit Code Status
        if: steps.run_suite.outcome != 'success'
        run: |
          echo "Daily automated test suite reported failures. Please inspect the attached report."
          exit 1
