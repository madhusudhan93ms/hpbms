name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:5001/api/v1
      CI: true
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps

    - name: Restore previous Playwright failures
      uses: actions/cache@v4
      with:
        path: frontend/test-results/.last-run.json
        key: playwright-last-run-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          playwright-last-run-${{ github.ref_name }}-

    - name: Run Playwright tests
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        cd frontend
        FAILED_STATUS=0
        NEW_STATUS=0

        HAS_FAILED_TESTS="no"
        if [ -f test-results/.last-run.json ]; then
          HAS_FAILED_TESTS=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('test-results/.last-run.json', 'utf8')); console.log(Array.isArray(d.failedTests) && d.failedTests.length > 0 ? 'yes' : 'no'); } catch(e) { console.log('no'); }")
        fi

        if [ "$HAS_FAILED_TESTS" = "yes" ]; then
          echo "Running previously failed tests..."
          npx playwright test --last-failed --pass-with-no-tests || FAILED_STATUS=$?
          if [ -f test-results/.last-run.json ]; then
            cp test-results/.last-run.json test-results/.failed-rerun.json
          fi
        else
          echo "No previously failed Playwright tests found; skipping failed-test rerun."
        fi

        if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          mapfile -t NEW_TEST_FILES < <(
            git diff --diff-filter=AM --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'tests/*.spec.js' \
              | sed 's#^frontend/##'
          )
        else
          NEW_TEST_FILES=()
        fi

        if [ ${#NEW_TEST_FILES[@]} -gt 0 ]; then
          echo "Running modified / newly created Playwright test files:"
          printf '  %s\n' "${NEW_TEST_FILES[@]}"
          npx playwright test --pass-with-no-tests "${NEW_TEST_FILES[@]}" || NEW_STATUS=$?
          if [ -f test-results/.last-run.json ]; then
            cp test-results/.last-run.json test-results/.new-tests-run.json
          fi
        else
          echo "No modified / newly created Playwright test files were found."
        fi

        node -e "const fs=require('fs'); const files=['test-results/.failed-rerun.json','test-results/.new-tests-run.json'].filter(fs.existsSync); if(files.length){const failed=[...new Set(files.flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')).failedTests||[]))]; fs.writeFileSync('test-results/.last-run.json',JSON.stringify({status:failed.length?'failed':'passed',failedTests:failed},null,2));} else { fs.mkdirSync('test-results', { recursive: true }); fs.writeFileSync('test-results/.last-run.json', JSON.stringify({ status: 'passed', failedTests: [] }, null, 2)); }"

        if [ "$FAILED_STATUS" -ne 0 ] || [ "$NEW_STATUS" -ne 0 ]; then
          exit 1
        fi

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
